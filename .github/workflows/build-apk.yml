name: Build EdgeLLM Android APK & Release Package

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release Packages
    runs-on: ubuntu-latest

    env:
      CI: "false"
      GRADLE_OPTS: "-Xmx3584m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
      BUILD_NUMBER: ${{ github.run_number }}
      APP_VERSION_NAME: "1.0.${{ github.run_number }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK & Accept Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          echo "Ensuring Android SDK platform 36 is present..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" 2>/dev/null || true

      - name: Prepare Environment & Keystores
        run: |
          # 1. Provide .env for Secrets Gradle plugin
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # 2. Provide debug.keystore required by signingConfigs.debugConfig
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Optional custom release keystore secret support
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Configuring custom release keystore from secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/my-upload-key.jks" || true
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            if [ -n "${{ secrets.STORE_PASSWORD }}" ]; then
              echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            fi
            if [ -n "${{ secrets.KEY_ALIAS }}" ]; then
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            fi
            if [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            fi
          fi

          # 4. Make gradlew executable
          chmod +x gradlew

      - name: Build Debug and Release APKs with Gradle
        run: ./gradlew assembleDebug assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Locate & Rename Generated APKs
        id: locate-apk
        run: |
          echo "Listing all generated APKs:"
          find app/build/outputs/apk -type f -name "*.apk" -ls
          
          mkdir -p dist-apks
          VERSION="1.0.${{ github.run_number }}"
          echo "Processing artifacts for Version: $VERSION"

          DEBUG_APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Release APK at: $RELEASE_APK"
            cp "$RELEASE_APK" "dist-apks/EdgeLLM-Studio-v${VERSION}-release.apk"
            cp "$RELEASE_APK" "dist-apks/EdgeLLM-Studio-release-latest.apk"
            echo "release_apk_path=dist-apks/EdgeLLM-Studio-v${VERSION}-release.apk" >> $GITHUB_OUTPUT
            echo "primary_apk_path=dist-apks/EdgeLLM-Studio-v${VERSION}-release.apk" >> $GITHUB_OUTPUT
          fi

          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK at: $DEBUG_APK"
            cp "$DEBUG_APK" "dist-apks/EdgeLLM-Studio-v${VERSION}-debug.apk"
            cp "$DEBUG_APK" "dist-apks/EdgeLLM-Studio-debug-latest.apk"
            echo "debug_apk_path=dist-apks/EdgeLLM-Studio-v${VERSION}-debug.apk" >> $GITHUB_OUTPUT
            if [ -z "$RELEASE_APK" ]; then
              echo "primary_apk_path=dist-apks/EdgeLLM-Studio-v${VERSION}-debug.apk" >> $GITHUB_OUTPUT
            fi
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Release APK Artifact
        if: steps.locate-apk.outputs.release_apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: EdgeLLM-Studio-v1.0.${{ github.run_number }}-Release-APK
          path: dist-apks/*release*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeLLM-Studio-v1.0.${{ github.run_number }}-Debug-APK
          path: dist-apks/*debug*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package Windows Desktop Bundle
        if: always() && steps.locate-apk.outputs.primary_apk_path != ''
        run: |
          mkdir -p dist-windows
          cp "${{ steps.locate-apk.outputs.primary_apk_path }}" dist-windows/EdgeLLM-Studio.apk
          if [ -d scripts/windows ]; then
            cp scripts/windows/* dist-windows/ 2>/dev/null || true
          fi
          cd dist-windows && zip -r ../EdgeLLM-Studio-Windows-Desktop.zip ./* && cd ..
          ls -lh EdgeLLM-Studio-Windows-Desktop.zip

      - name: Upload Windows Desktop Artifact
        if: always() && steps.locate-apk.outputs.primary_apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: EdgeLLM-Studio-Windows-Desktop-Bundle
          path: EdgeLLM-Studio-Windows-Desktop.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release (Tagged Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-apks/*.apk
            EdgeLLM-Studio-Windows-Desktop.zip
          name: "EdgeLLM Studio ${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release (Main Branch Auto-Release)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "EdgeLLM Studio Release v1.0.${{ github.run_number }}"
          body: |
            ### 🚀 Automated Build Release v1.0.${{ github.run_number }}
            - **Commit**: `${{ github.sha }}`
            - **Version Code**: `${{ github.run_number }}`
            - **Version Name**: `1.0.${{ github.run_number }}`
            - **Release APK**: Included below (Self-contained, installable directly on Android 7.0+)
            - **Debug APK**: Included below for ADB logcat diagnostics
            - **Windows Desktop Bundle**: Included below with WSA launcher script
          files: |
            dist-apks/*.apk
            EdgeLLM-Studio-Windows-Desktop.zip
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
