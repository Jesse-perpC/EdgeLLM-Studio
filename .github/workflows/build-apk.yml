name: Build EdgeLLM Android APK & Release Package

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs (CPU & Vulkan)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ALLOW_DEBUG_SIGNED_RELEASE: "true"
      GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false"
      BUILD_NUMBER: ${{ github.run_number }}
      APP_VERSION_NAME: "1.0.${{ github.run_number }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Initialize llama.cpp submodule
        shell: bash
        run: |
          git submodule update --init --recursive --depth 1 || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Setup Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          echo "Installing Android SDK Platform 36, NDK 27 and CMake..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1" \
            "build-tools;35.0.0" || true

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Ensure settings.gradle.kts exists
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "Creating missing settings.gradle.kts..."
            echo 'pluginManagement {' > settings.gradle.kts
            echo '    repositories {' >> settings.gradle.kts
            echo '        google()' >> settings.gradle.kts
            echo '        mavenCentral()' >> settings.gradle.kts
            echo '        gradlePluginPortal()' >> settings.gradle.kts
            echo '    }' >> settings.gradle.kts
            echo '}' >> settings.gradle.kts
            echo 'dependencyResolutionManagement {' >> settings.gradle.kts
            echo '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' >> settings.gradle.kts
            echo '    repositories {' >> settings.gradle.kts
            echo '        google()' >> settings.gradle.kts
            echo '        mavenCentral()' >> settings.gradle.kts
            echo '    }' >> settings.gradle.kts
            echo '}' >> settings.gradle.kts
            echo 'rootProject.name = "EdgeLLM Studio"' >> settings.gradle.kts
            echo 'include(":app")' >> settings.gradle.kts
          fi

          # Generate debug.keystore if not committed, ensuring release signing fallback works in CI
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for CI release build signing..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure gradlew exists with executable permissions and LF line endings
          if [ ! -f ./gradlew ] || [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin || true
          fi
          sed -i 's/\r$//' ./gradlew 2>/dev/null || true
          chmod +x ./gradlew

          echo "=== Environment ready ==="
          ./gradlew --version

      - name: Install native build dependencies (Vulkan / SPIR-V)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libvulkan-dev spirv-headers glslc pkg-config
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/SPIRV-Headers
          cmake -S /tmp/SPIRV-Headers -B /tmp/SPIRV-Headers/build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install /tmp/SPIRV-Headers/build
          mkdir -p /tmp/vkinc
          cp -r /usr/include/vulkan /tmp/vkinc/ || true
          [ -d /usr/include/vk_video ] && cp -r /usr/include/vk_video /tmp/vkinc/ || true
          cp -r /usr/local/include/spirv /tmp/vkinc/ || true

      - name: Build Android APKs (Release & Debug)
        shell: bash
        run: |
          set -euo pipefail
          echo "Building with version ${APP_VERSION_NAME} (run #${BUILD_NUMBER})..."

          sed -i 's/\r$//' ./gradlew 2>/dev/null || true
          chmod +x ./gradlew

          if ! ./gradlew assembleCpuRelease assembleVulkanRelease --no-daemon --stacktrace; then
            echo "::warning::Release assembly failed, falling back to assembleCpuDebug assembleVulkanDebug"
            ./gradlew assembleCpuDebug assembleVulkanDebug --no-daemon --stacktrace
          fi

      - name: Stage APKs with ascending version numbers
        id: stage_apks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-apks
          VERSION_TAG="${APP_VERSION_NAME}"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
            RELEASE_TITLE="EdgeLLM Studio ${{ github.ref_name }}"
          else
            RELEASE_TAG="v${VERSION_TAG}"
            RELEASE_TITLE="EdgeLLM Studio v${VERSION_TAG}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          mapfile -t apks < <(find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || true)

          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No APK files were produced"
            find app/build -type f -name "*.apk" || true
            exit 1
          fi

          for apk_path in "${apks[@]}"; do
            flavor=$(echo "$apk_path" | awk -F'/' '{print $(NF-2)}')
            type=$(echo "$apk_path" | awk -F'/' '{print $(NF-1)}')
            target="EdgeLLM-v${VERSION_TAG}-${flavor}-${type}.apk"
            echo "Staging -> release-apks/${target}"
            cp "$apk_path" "release-apks/${target}"
          done

          echo "COUNT=${#apks[@]}" >> "$GITHUB_OUTPUT"
          ls -lh release-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edgellm-apks-v${{ env.APP_VERSION_NAME }}
          path: release-apks/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release with Ascending Version
        if: >-
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' ||
             github.ref == 'refs/heads/master' ||
             startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'workflow_dispatch' &&
            inputs.create_release != false)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage_apks.outputs.RELEASE_TAG }}
          name: ${{ steps.stage_apks.outputs.RELEASE_TITLE }}
          body: |
            ## 🚀 EdgeLLM Studio Release v1.0.${{ github.run_number }}

            Automated build for commit `${{ github.sha }}`.

            ### 📦 Included APK Packages:
            - **ARM NEON CPU Flavor**: Compatible with all ARM64 Android devices (runs GGUF on ARM NEON SIMD).
            - **Vulkan GPU Flavor**: Hardware-accelerated Vulkan compute shaders for Adreno / Mali GPUs.

            ### 🔢 Version Telemetry:
            - **Build Number**: `${{ github.run_number }}`
            - **Version Name**: `1.0.${{ github.run_number }}`
            - **Target Platform**: Android 14+ (API 34–36)
          files: release-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
