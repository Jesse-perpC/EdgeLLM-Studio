name: Build EdgeLLM Android APK & Release Package

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  # Releases need write; PRs/pushes only need read. Tag-only releases
  # (below) keep this scoped in practice.
  contents: write

# Cancel superseded runs on the same branch/PR for faster, cheaper CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK & Release Packages
    runs-on: ubuntu-latest

    env:
      CI: "false"
      # CI-only: permit debug-signed release artifacts (no upload key on runners).
      # These must never be published to Play; see app/build.gradle.kts.
      ALLOW_DEBUG_SIGNED_RELEASE: "true"
      # packageDebug OOMs below ~4GB once the tasks-genai native libs (.so set)
      # join the APK; ubuntu-latest runners have 16GB so 6GB is safe.
      # (Local sandbox default stays 1536m in gradle.properties for 2GB cgroups;
      # CI runs --no-daemon so this GRADLE_OPTS governs the build JVM.)
      GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
      BUILD_NUMBER: ${{ github.run_number }}
      APP_VERSION_NAME: "1.0.${{ github.run_number }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Init llama.cpp submodule (pinned, shallow)
        # The native GGUF engine builds against this exact commit; the full
        # llama.cpp history is ~1GB, so only the pinned commit is fetched.
        # CMakeLists.txt fails the build if this directory is empty.
        run: git submodule update --init --depth 1 -- llama.cpp

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK & Accept Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          echo "Ensuring Android SDK platform 36 is present..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" 2>/dev/null || true
          echo "Installing NDK + CMake for llama-android JNI bridge..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1" 2>/dev/null || true

      - name: Prepare Environment & Keystores
        run: |
          # 1. Provide .env for Secrets Gradle plugin
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # 2. Provide debug.keystore required by signingConfigs.debugConfig
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Optional custom release keystore secret support
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Configuring custom release keystore from secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/my-upload-key.jks" || true
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            if [ -n "${{ secrets.STORE_PASSWORD }}" ]; then
              echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            fi
            if [ -n "${{ secrets.KEY_ALIAS }}" ]; then
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            fi
            if [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            fi
          fi

# 4. Make gradlew executable
          chmod +x gradlew

      - name: Install Vulkan build deps (vulkan flavor only)
        # ggml's Vulkan backend needs the loader headers, SPIR-V headers, glslc,
        # and the C++ Vulkan API bindings (vulkan.hpp). Ubuntu 24.04's
        # libvulkan-dev provides the C API (vulkan.h) + ICD loader but NOT
        # vulkan.hpp. We build vulkan-headers from source (like SPIRV-Headers)
        # to get the C++ bindings needed for Android NDK cross-compilation.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev spirv-headers glslc cmake g++
          glslc --version
          ls /usr/include/vulkan/vulkan.h
          # Build vulkan-headers from source (header-only, ~1 min) to obtain
          # the C++ API (vulkan.hpp) that Android NDK cross-compile needs.
          # Installs to /usr/local, so check there first.
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/Vulkan-Headers
          cmake -S /tmp/Vulkan-Headers -B /tmp/Vulkan-Headers/build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install /tmp/Vulkan-Headers/build
          ls /usr/local/include/vulkan/vulkan.hpp || ls /usr/include/vulkan/vulkan.hpp
          ls /usr/local/include/vulkan/vulkan.h || ls /usr/include/vulkan/vulkan.h
          # Ubuntu's spirv-headers ships headers but no CMake package config,
          # which ggml-vulkan's find_package(SPIRV-Headers) requires. Build the
          # header-only upstream once (~1 min) and install the config to
          # /usr/local; headers themselves keep coming from the apt package.
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/SPIRV-Headers
          cmake -S /tmp/SPIRV-Headers -B /tmp/SPIRV-Headers/build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install /tmp/SPIRV-Headers/build
          ls /usr/local/lib/cmake/SPIRV-Headers/ 2>/dev/null || ls /usr/local/share/cmake/SPIRV-Headers/ 2>/dev/null || echo "SPIRV-Headers cmake config check done"
          # Export the config dir for the vulkan flavor: NDK cross-builds hide
          # host paths from find_package, so Gradle passes this as an explicit
          # -DSPIRV-Headers_DIR (see app/build.gradle.kts).
          SPIRV_CFG=$(find /usr/local -name "SPIRV-HeadersConfig.cmake" 2>/dev/null | head -1)
          if [ -n "$SPIRV_CFG" ]; then
            echo "SPIRV_HEADERS_DIR=$(dirname "$SPIRV_CFG")" >> $GITHUB_ENV
            echo "SPIRV_HEADERS_DIR=$(dirname "$SPIRV_CFG")"
          else
            echo "ERROR: SPIRV-HeadersConfig.cmake not found after install" >&2
            exit 1
          fi

      - name: Run unit + Robolectric tests (quality gate)
        # INSTALL.md documents this command. Failing tests block APK assembly.
        run: ./gradlew testCpuDebugUnitTest --no-daemon --stacktrace

      - name: Enforce real release key for tags
        # A debug-signed "release" must never be published as a versioned
        # GitHub Release or to Play (publicly known debug key, Play rejects).
        # Tags therefore require RELEASE_KEYSTORE_BASE64; branch builds may
        # still use ALLOW_DEBUG_SIGNED_RELEASE=true for diagnostics.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: tag ${{ github.ref_name }} needs secrets.RELEASE_KEYSTORE_BASE64 (+ STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)." >&2
            echo "Refusing to publish a debug-signed release." >&2
            exit 1
          fi

      - name: Build Debug and Release APKs with Gradle
        run: ./gradlew assembleCpuDebug assembleCpuRelease assembleVulkanDebug assembleVulkanRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Locate & Rename Generated APKs
        id: locate-apk
        run: |
          echo "Listing all generated APKs:"
          find app/build/outputs/apk -type f -name "*.apk" -ls
          
          mkdir -p dist-apks
          VERSION="1.0.${{ github.run_number }}"
          echo "Processing artifacts for Version: $VERSION"

          # With productFlavors the outputs live under apk/<flavor>/<buildType>/.
          # Name every combination explicitly; the cpu release stays the
          # default `-latest` artifact so existing installs keep updating.
          for FLAVOR in cpu vulkan; do
            for TYPE in debug release; do
              APK=$(find "app/build/outputs/apk/$FLAVOR/$TYPE" -type f -name "*.apk" | head -n 1)
              if [ -n "$APK" ] && [ -f "$APK" ]; then
                echo "Found $FLAVOR/$TYPE APK at: $APK"
                cp "$APK" "dist-apks/EdgeLLM-Studio-v${VERSION}-${FLAVOR}-${TYPE}.apk"
                if [ "$FLAVOR" = "cpu" ] && [ "$TYPE" = "release" ]; then
                  cp "$APK" "dist-apks/EdgeLLM-Studio-release-latest.apk"
                  cp "$APK" "dist-apks/EdgeLLM-Studio-v${VERSION}-release.apk"
                  echo "release_apk_path=dist-apks/EdgeLLM-Studio-v${VERSION}-release.apk" >> $GITHUB_OUTPUT
                  echo "primary_apk_path=dist-apks/EdgeLLM-Studio-v${VERSION}-release.apk" >> $GITHUB_OUTPUT
                fi
                if [ "$FLAVOR" = "cpu" ] && [ "$TYPE" = "debug" ]; then
                  cp "$APK" "dist-apks/EdgeLLM-Studio-debug-latest.apk"
                  cp "$APK" "dist-apks/EdgeLLM-Studio-v${VERSION}-debug.apk"
                  echo "debug_apk_path=dist-apks/EdgeLLM-Studio-v${VERSION}-debug.apk" >> $GITHUB_OUTPUT
                  if [ -z "${RELEASE_SEEN:-}" ]; then
                    echo "primary_apk_path=dist-apks/EdgeLLM-Studio-v${VERSION}-debug.apk" >> $GITHUB_OUTPUT
                  fi
                fi
                if [ "$FLAVOR" = "cpu" ] && [ "$TYPE" = "release" ]; then
                  RELEASE_SEEN=1
                fi
              else
                echo "WARNING: no $FLAVOR/$TYPE APK produced"
              fi
            done
          done

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Release APK Artifact
        if: steps.locate-apk.outputs.release_apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: EdgeLLM-Studio-v1.0.${{ github.run_number }}-Release-APK
          path: dist-apks/*release*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeLLM-Studio-v1.0.${{ github.run_number }}-Debug-APK
          path: dist-apks/*debug*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package Windows Desktop Bundle
        if: always() && steps.locate-apk.outputs.primary_apk_path != ''
        run: |
          mkdir -p dist-windows
          cp "${{ steps.locate-apk.outputs.primary_apk_path }}" dist-windows/EdgeLLM-Studio.apk
          if [ -d scripts/windows ]; then
            cp scripts/windows/* dist-windows/ 2>/dev/null || true
          fi
          cd dist-windows && zip -r ../EdgeLLM-Studio-Windows-Desktop.zip ./* && cd ..
          ls -lh EdgeLLM-Studio-Windows-Desktop.zip

      - name: Upload Windows Desktop Artifact
        if: always() && steps.locate-apk.outputs.primary_apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: EdgeLLM-Studio-Windows-Desktop-Bundle
          path: EdgeLLM-Studio-Windows-Desktop.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release (Tagged Push only)
        # Production rule: versioned Releases are created from tags (v*).
        # Pushes to main/master only upload artifacts (above) — no release spam,
        # no accidental debug-signed "releases".
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-apks/*.apk
            EdgeLLM-Studio-Windows-Desktop.zip
          name: "EdgeLLM Studio ${{ github.ref_name }}"
          body: |
            ### EdgeLLM Studio ${{ github.ref_name }}
            - **Commit**: `${{ github.sha }}`
            - **Release APK (cpu)**: Default install. GGUF decodes on CPU (ARM NEON); ONNX/TFLite/MediaPipe use NNAPI delegates where the device provides them.
            - **Release APK (vulkan)**: Same app with the ggml Vulkan backend compiled in (separate `.vulkan` package, installs side-by-side). Needs a device Vulkan driver; falls back to CPU otherwise.
            - **Debug APK**: Included for ADB logcat diagnostics only, not for distribution.
            - **Not included**: Hexagon HTP/NPU offload (licensed SDK), MNN-LLM runtime (see `scripts/setup-mnn.md`), AICore/Gemini Nano (no public SDK).
            - Signed with the release upload key (tag builds refuse debug-signed fallback — see workflow).
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
