name: Build EdgeLLM Android APK & Release Package

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APKs (CPU & Vulkan)
    runs-on: ubuntu-latest
    env:
      CI: "false"
      # CI-only: permit debug-signed release artifacts when upload key is absent.
      ALLOW_DEBUG_SIGNED_RELEASE: "true"
      GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
      BUILD_NUMBER: ${{ github.run_number }}
      APP_VERSION_NAME: "1.0.${{ github.run_number }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Initialize llama.cpp submodule (shallow)
        run: |
          git submodule update --init --depth 1 llama.cpp || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK, NDK and CMake
        shell: bash
        run: |
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          echo "Installing Android SDK Platform 36..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" 2>/dev/null || true
          echo "Installing NDK and CMake for llama-android JNI..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1" 2>/dev/null || true

      - name: Prepare build environment & signing keystore
        shell: bash
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi

          # Generate debug.keystore if not committed, ensuring release signing fallback works in CI
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for CI release build signing..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure gradlew exists and is executable
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found. Generating wrapper with gradle wrapper..."
            gradle wrapper || true
          fi
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Install native Vulkan build dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libvulkan-dev spirv-headers glslc
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/SPIRV-Headers
          cmake -S /tmp/SPIRV-Headers -B /tmp/SPIRV-Headers/build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install /tmp/SPIRV-Headers/build
          mkdir -p /tmp/vkinc && cp -r /usr/include/vulkan /tmp/vkinc/
          if [ -d /usr/include/vk_video ]; then
            cp -r /usr/include/vk_video /tmp/vkinc/
          fi
          cp -r /usr/local/include/spirv /tmp/vkinc/

      - name: Build Android APKs (Release & Debug)
        shell: bash
        run: |
          echo "Building CPU and Vulkan flavors with version 1.0.${{ github.run_number }}..."

          # Resolve gradle command: prefer ./gradlew, fallback to installed gradle
          if [ -x ./gradlew ]; then
            GRADLE_CMD="./gradlew"
          elif [ -f ./gradlew ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          elif command -v gradle >/dev/null 2>&1; then
            echo "gradlew not found, using gradle CLI..."
            GRADLE_CMD="gradle"
          else
            echo "Generating wrapper..."
            gradle wrapper
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          fi

          echo "Using command: $GRADLE_CMD"
          $GRADLE_CMD assembleCpuRelease assembleVulkanRelease --no-daemon --stacktrace || \
          $GRADLE_CMD assembleCpuDebug assembleVulkanDebug --no-daemon --stacktrace

      - name: Stage APKs with ascending version numbers
        id: stage_apks
        shell: bash
        run: |
          mkdir -p release-apks
          VERSION_TAG="1.0.${{ github.run_number }}"

          # Locate and copy built APKs
          find app/build/outputs/apk -name "*.apk" -type f | while read -r apk_path; do
            flavor=$(echo "$apk_path" | awk -F'/' '{print $(NF-2)}')
            type=$(echo "$apk_path" | awk -F'/' '{print $(NF-1)}')
            base_name=$(basename "$apk_path")
            target_name="EdgeLLM-v${VERSION_TAG}-${flavor}-${type}.apk"
            echo "Staging $apk_path -> release-apks/$target_name"
            cp "$apk_path" "release-apks/$target_name"
          done

          ls -la release-apks/
          echo "COUNT=$(find release-apks -name '*.apk' | wc -l)" >> $GITHUB_OUTPUT

      - name: Upload APKs to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edgellm-apks-v1.0.${{ github.run_number }}
          path: release-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release with Ascending Version
        if: >
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release != 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('EdgeLLM Studio {0}', github.ref_name) || format('EdgeLLM Studio v1.0.{0}', github.run_number) }}
          body: |
            ## 🚀 EdgeLLM Studio Release v1.0.${{ github.run_number }}

            Automated build for commit `${{ github.sha }}`.

            ### 📦 Included APK Packages:
            - **ARM NEON CPU Flavor**: Compatible with all ARM64 Android devices (runs GGUF on ARM NEON SIMD).
            - **Vulkan GPU Flavor**: Hardware-accelerated Vulkan compute shaders for Adreno / Mali GPUs.

            ### 🔢 Version Telemetry:
            - **Build Number**: `${{ github.run_number }}`
            - **Version Name**: `1.0.${{ github.run_number }} `
            - **Target Platform**: Android 14+ (API 34–36)
          files: release-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
