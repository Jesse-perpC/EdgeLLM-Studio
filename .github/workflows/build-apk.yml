name: Build EdgeLLM Android APK & Release Package

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs (CPU & Vulkan)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # Allow debug-signed release artifacts when no upload keystore is present
      ALLOW_DEBUG_SIGNED_RELEASE: "true"
      GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false"
      BUILD_NUMBER: ${{ github.run_number }}
      APP_VERSION_NAME: "1.0.${{ github.run_number }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          submodules: recursive   # better than manual shallow init

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Setup Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        # Fallback manual install if the action is unavailable
        continue-on-error: true

      - name: Install Android SDK components (fallback)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME not set – installing command-line tools..."
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1" \
            "build-tools;35.0.0" || true

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail

          # .env for any local config the app expects
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Ensure settings.gradle.kts exists (only create if completely missing)
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "Creating settings.gradle.kts..."
            echo 'pluginManagement {' > settings.gradle.kts
            echo '    repositories {' >> settings.gradle.kts
            echo '        google()' >> settings.gradle.kts
            echo '        mavenCentral()' >> settings.gradle.kts
            echo '        gradlePluginPortal()' >> settings.gradle.kts
            echo '    }' >> settings.gradle.kts
            echo '}' >> settings.gradle.kts
            echo 'dependencyResolutionManagement {' >> settings.gradle.kts
            echo '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' >> settings.gradle.kts
            echo '    repositories {' >> settings.gradle.kts
            echo '        google()' >> settings.gradle.kts
            echo '        mavenCentral()' >> settings.gradle.kts
            echo '    }' >> settings.gradle.kts
            echo '}' >> settings.gradle.kts
            echo 'rootProject.name = "EdgeLLM Studio"' >> settings.gradle.kts
            echo 'include(":app")' >> settings.gradle.kts
          fi

          # Debug keystore fallback (only used when no real signing secrets are present)
          if [ ! -f debug.keystore ]; then
            echo "Generating temporary debug.keystore for CI..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Make sure the Gradle wrapper is present and executable
          if [ ! -f ./gradlew ] || [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper missing – regenerating..."
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin || true
          fi
          sed -i 's/\r$//' ./gradlew 2>/dev/null || true
          chmod +x ./gradlew

          echo "=== Environment ready ==="
          ./gradlew --version

      - name: Install native build dependencies (Vulkan / SPIR-V)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake g++ libvulkan-dev spirv-headers glslc pkg-config

          # Install SPIRV-Headers to a known location
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/SPIRV-Headers
          cmake -S /tmp/SPIRV-Headers -B /tmp/SPIRV-Headers/build \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install /tmp/SPIRV-Headers/build

          # Collect Vulkan / SPIR-V headers for the NDK build
          mkdir -p /tmp/vkinc
          cp -r /usr/include/vulkan /tmp/vkinc/ || true
          [ -d /usr/include/vk_video ] && cp -r /usr/include/vk_video /tmp/vkinc/ || true
          cp -r /usr/local/include/spirv /tmp/vkinc/ || true

      - name: Fast validation – compile Kotlin (CPU debug)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileCpuDebugKotlin --no-daemon --stacktrace

      - name: Build release APKs (CPU + Vulkan)
        shell: bash
        run: |
          set -euo pipefail
          echo "Building with version ${APP_VERSION_NAME} (run #${BUILD_NUMBER})"

          # Prefer release builds; fall back to debug only if release fails
          if ! ./gradlew assembleCpuRelease assembleVulkanRelease \
                --no-daemon --stacktrace; then
            echo "::warning::Release build failed – falling back to debug variants"
            ./gradlew assembleCpuDebug assembleVulkanDebug \
              --no-daemon --stacktrace
          fi

      - name: Stage APKs
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-apks
          VERSION_TAG="${APP_VERSION_NAME}"

          mapfile -t apks < <(find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || true)

          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No APK files were produced"
            find app/build -type f -name "*.apk" || true
            exit 1
          fi

          for apk_path in "${apks[@]}"; do
            # Extract flavor and build type from path
            flavor=$(echo "$apk_path" | awk -F'/' '{print $(NF-2)}')
            type=$(echo "$apk_path" | awk -F'/' '{print $(NF-1)}')
            target="EdgeLLM-v${VERSION_TAG}-${flavor}-${type}.apk"
            echo "Staging → release-apks/${target}"
            cp "$apk_path" "release-apks/${target}"
          done

          echo "COUNT=${#apks[@]}" >> "$GITHUB_OUTPUT"
          ls -lh release-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edgellm-apks-v${{ env.APP_VERSION_NAME }}
          path: release-apks/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: >
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' ||
             github.ref == 'refs/heads/master' ||
             startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'workflow_dispatch' &&
            github.event.inputs.create_release != 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('EdgeLLM Studio {0}', github.ref_name) || format('EdgeLLM Studio v1.0.{0}', github.run_number) }}
          body: |
            ## EdgeLLM Studio v1.0.${{ github.run_number }}

            Automated build from `${{ github.sha }}`.

            ### Packages
            - **CPU (ARM NEON)** – universal ARM64
            - **Vulkan** – GPU-accelerated (Adreno / Mali)

            ### Version
            - Build: `${{ github.run_number }}`
            - Version name: `1.0.${{ github.run_number }}`
            - Target: Android 14+ (API 34–36)
          files: release-apks/*.apk
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
