name: Build EdgeLLM Android APK & Release Package

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "false"
      # CI-only: permit debug-signed release artifacts (no upload key on runners).
      # These must never be published to Play; see app/build.gradle.kts.
      ALLOW_DEBUG_SIGNED_RELEASE: "true"
      # packageDebug OOMs below ~4GB once the tasks-genai native libs (.so set)
      # join the APK; ubuntu-latest runners have 16GB so 6GB is safe.
      # (Local sandbox default stays 1536m in gradle.properties for 2GB cgroups;
      # CI runs --no-daemon so this GRADLE_OPTS governs the build JVM.)
      GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
      BUILD_NUMBER: ${{ github.run_number }}
      APP_VERSION_NAME: "1.0.${{ github.run_number }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Init llama.cpp submodule (pinned, shallow)
        # The native GGUF engine builds against this exact commit; the full
        # llama.cpp history is ~1GB, so only the pinned commit is fetched.
        # CMakeLists.txt fails the build if this directory is empty.
        run: git submodule update --init --depth 1 -- llama.cpp

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        shell: bash
        run: |
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          echo "Ensuring Android SDK platform 36 is present..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" 2>/dev/null || true
          echo "Installing NDK + CMake for llama-android JNI bridge..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1" 2>/dev/null || true

      - name: Prepare environment
        shell: bash
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi
          chmod +x gradlew

      - name: Validate Kotlin/Gradle project
        # FAST GATE: Catch Kotlin syntax errors, build config issues, and
        # Gradle setup problems before starting the expensive native build.
        # This step type-checks the CPU flavor only (no Vulkan dependency).
        run: ./gradlew :app:compileCpuDebugKotlin --no-daemon --stacktrace
        timeout-minutes: 120

      - name: Install native build deps (vulkan flavor only)
        # ggml's Vulkan backend needs the loader headers, SPIRV-Headers, and
        # glslc at CMake time. Ubuntu 24.04 provides all three without
        # third-party repos: libvulkan-dev (loader+headers), spirv-headers,
        # glslc (shader compiler binary). The default cpu flavor does not
        # need any of this.
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libvulkan-dev spirv-headers glslc
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/SPIRV-Headers
          cmake -S /tmp/SPIRV-Headers -B /tmp/SPIRV-Headers/build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install /tmp/SPIRV-Headers/build
          mkdir -p /tmp/vkinc && cp -r /usr/include/vulkan /tmp/vkinc/
          if [ -d /usr/include/vk_video ]; then
            cp -r /usr/include/vk_video /tmp/vkinc/
          fi
          cp -r /usr/local/include/spirv /tmp/vkinc/
          # ggml-vulkan also includes <spirv/unified1/spirv.hpp>; the headers
          # installed above went to /usr/local/include (outside the NDK
          # include path), so stage them into the same isolated dir.
          cp -r /usr/local/include/spirv /tmp/vkinc/
          ls /tmp/vkinc/vulkan/vulkan.hpp /tmp/vkinc/vk_video/vulkan_video_codec_av1std.h
          ls /tmp/vkinc/spirv/unified1/spirv.hpp

      - name: Build APKs
        run: ./gradlew assembleCpuDebug assembleCpuRelease assembleVulkanDebug assembleVulkanRelease --no-daemon --no-configuration-cache --stacktrace
        timeout-minutes: 300

      - name: Collect APK outputs
        id: collect
        shell: bash
        run: |
          mkdir -p dist-apks
          VERSION="1.0.${{ github.run_number }}"
          echo "Processing artifacts for Version: $VERSION"

          for flavor in cpu vulkan; do
            for type in debug release; do
              apk=$(find "app/build/outputs/apk/${flavor}/${type}" -type f -name "*.apk" | head -n 1)
              if [ -n "$apk" ]; then
                cp "$apk" "dist-apks/EdgeLLM-Studio-v${VERSION}-${flavor}-${type}.apk"
              fi
            done
          done

          if [ -f "dist-apks/EdgeLLM-Studio-v${VERSION}-cpu-release.apk" ]; then
            echo "release_apk_path=dist-apks/EdgeLLM-Studio-v${VERSION}-cpu-release.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifact
        if: steps.collect.outputs.release_apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: EdgeLLM-Studio-APK
          path: dist-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package Windows Desktop Bundle
        if: always() && steps.collect.outputs.release_apk_path != ''
        run: |
          mkdir -p dist-windows
          cp "${{ steps.collect.outputs.release_apk_path }}" dist-windows/EdgeLLM-Studio.apk
          if [ -d scripts/windows ]; then
            cp scripts/windows/* dist-windows/ 2>/dev/null || true
          fi
          cd dist-windows && zip -r ../EdgeLLM-Studio-Windows-Desktop.zip ./* && cd ..
          ls -lh EdgeLLM-Studio-Windows-Desktop.zip

      - name: Upload Windows Desktop Artifact
        if: always() && steps.collect.outputs.release_apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: EdgeLLM-Studio-Windows-Desktop-Bundle
          path: EdgeLLM-Studio-Windows-Desktop.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release (Tagged Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-apks/*.apk
            EdgeLLM-Studio-Windows-Desktop.zip
          name: "EdgeLLM Studio ${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release (Main Branch Auto-Release)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "EdgeLLM Studio Release v1.0.${{ github.run_number }}"
          body: |
            ### 🚀 Automated Build Release v1.0.${{ github.run_number }}
            - **Commit**: `${{ github.sha }}`
            - **Version Code**: `${{ github.run_number }}`
            - **Version Name**: `1.0.${{ github.run_number }}`
            - **Release APK (cpu)**: Default install. GGUF decodes on CPU (ARM NEON); ONNX/TFLite/MediaPipe use NNAPI delegates where the device provides them. Self-contained, installable directly on Android 7.0+.
            - **Release APK (vulkan)**: Same app with the ggml Vulkan backend compiled in (separate `com.aistudio.edgellm.qvmxrp.vulkan` package, installs side-by-side). Needs a device with a Vulkan driver; falls back to CPU otherwise.
            - **Debug APK**: Included below for ADB logcat diagnostics
            - **Not included**: Hexagon HTP/NPU offload (licensed Hexagon SDK, not shippable from CI), MNN-LLM runtime (no Maven artifact — see `scripts/setup-mnn.md`), AICore/Gemini Nano (no public SDK).
          files: |
            dist-apks/*.apk
            EdgeLLM-Studio-Windows-Desktop.zip
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}