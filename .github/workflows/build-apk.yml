name: EdgeLLM Android CI and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgellm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
  BUILD_NUMBER: ${{ github.run_number }}
  APP_VERSION_NAME: "1.0.${{ github.run_number }}"

jobs:
  verify:
    name: Verify CPU build, lint, and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Prepare non-secret build configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .env.example ]]; then cp .env.example .env; else touch .env; fi
          chmod +x ./gradlew
          keytool -genkeypair -v             -keystore debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Run CPU debug build, lint, static analysis, and unit tests
        run: ./gradlew --no-daemon --stacktrace assembleCpuDebug lintCpuDebug ktlintCheck testCpuDebugUnitTest

      - name: Upload debug APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: EdgeLLM-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build and publish signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Validate release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_KEYSTORE_BASE64" ]] || { echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          [[ -n "$STORE_PASSWORD" ]] || { echo "::error::Missing STORE_PASSWORD secret"; exit 1; }
          [[ -n "$KEY_ALIAS" ]] || { echo "::error::Missing KEY_ALIAS secret"; exit 1; }
          [[ -n "$KEY_PASSWORD" ]] || { echo "::error::Missing KEY_PASSWORD secret"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-upload-key.jks"
          test -s "$RUNNER_TEMP/release-upload-key.jks"
          keytool -list -keystore "$RUNNER_TEMP/release-upload-key.jks"             -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release-upload-key.jks"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          if [[ -f .env.example ]]; then cp .env.example .env; else touch .env; fi
          chmod +x ./gradlew

      - name: Build signed production CPU APK
        run: ./gradlew --no-daemon --stacktrace assembleCpuRelease

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          mkdir -p dist
          cp "$APK" "dist/EdgeLLM-Studio-${GITHUB_REF_NAME}-release.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose dist/*.apk
          else
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose dist/*.apk
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeLLM-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EdgeLLM Studio ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
