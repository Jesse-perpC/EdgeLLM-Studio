name: Build EdgeLLM Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      CI: "false"
      GRADLE_OPTS: "-Xmx3584m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK & Accept Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          echo "Ensuring Android SDK platform 36 is present..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" 2>/dev/null || true

      - name: Prepare Environment & Keystore
        run: |
          # 1. Provide .env for Secrets Gradle plugin
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # 2. Provide debug.keystore required by signingConfigs.debugConfig
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Make gradlew executable
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Locate Generated APK
        id: locate-apk
        run: |
          echo "Listing all APKs:"
          find app/build/outputs/apk -type f -name "*.apk" -ls
          APK_PATH=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK generated!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeLLM-Studio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package Windows Desktop Bundle
        if: always() && steps.locate-apk.outputs.apk_path != ''
        run: |
          mkdir -p dist-windows
          cp "${{ steps.locate-apk.outputs.apk_path }}" dist-windows/EdgeLLM-Studio.apk
          if [ -d scripts/windows ]; then
            cp scripts/windows/* dist-windows/ 2>/dev/null || true
          fi
          cd dist-windows && zip -r ../EdgeLLM-Studio-Windows-Desktop.zip ./* && cd ..
          ls -lh EdgeLLM-Studio-Windows-Desktop.zip

      - name: Upload Windows Desktop Artifact
        if: always() && steps.locate-apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: EdgeLLM-Studio-Windows-Desktop-Bundle
          path: EdgeLLM-Studio-Windows-Desktop.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            EdgeLLM-Studio-Windows-Desktop.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
