name: Build EdgeLLM Android APK & Release Package

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs (CPU & Vulkan)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ALLOW_DEBUG_SIGNED_RELEASE: "true"
      GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false"
      BUILD_NUMBER: ${{ github.run_number }}
      APP_VERSION_NAME: "1.0.${{ github.run_number }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Setup Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Configure Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d "/usr/local/lib/android/sdk" ]; then
              export ANDROID_HOME="/usr/local/lib/android/sdk"
            elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "${ANDROID_SDK_ROOT}" ]; then
              export ANDROID_HOME="${ANDROID_SDK_ROOT}"
            fi
            echo "ANDROID_HOME=${ANDROID_HOME:-}" >> "$GITHUB_ENV"
          fi

          SDK_MGR=""
          for cand in \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME:-}/cmdline-tools/bin/sdkmanager" \
            "${ANDROID_HOME:-}/tools/bin/sdkmanager"; do
            if [ -x "$cand" ]; then
              SDK_MGR="$cand"
              break
            fi
          done

          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
            "$SDK_MGR" \
              "platforms;android-36" \
              "ndk;27.3.13750724" \
              "cmake;3.22.1" \
              "build-tools;35.0.0" || true
          else
            echo "Using pre-configured runner Android SDK environment."
          fi

      - name: Prepare build environment & Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          # Create .env if missing
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Ensure settings.gradle.kts exists
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "Creating settings.gradle.kts..."
            {
              echo 'pluginManagement {'
              echo '    repositories {'
              echo '        google()'
              echo '        mavenCentral()'
              echo '        gradlePluginPortal()'
              echo '    }'
              echo '}'
              echo 'dependencyResolutionManagement {'
              echo '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)'
              echo '    repositories {'
              echo '        google()'
              echo '        mavenCentral()'
              echo '    }'
              echo '}'
              echo 'rootProject.name = "EdgeLLM Studio"'
              echo 'include(":app")'
            } > settings.gradle.kts
          fi

          # Debug keystore fallback
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for CI..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure gradle wrapper and jar exist
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Fetching gradle-wrapper.jar..."
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar || true
          fi

          if [ ! -f ./gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Regenerating wrapper with gradle CLI..."
            gradle wrapper --gradle-version 8.10.2 || true
          fi

          # Strip Windows CRLF line-endings and ensure executable
          sed -i 's/\r$//' ./gradlew 2>/dev/null || true
          chmod +x ./gradlew

          echo "=== Gradle Wrapper Check ==="
          ./gradlew --version

      - name: Install native build dependencies (Vulkan / SPIR-V)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake g++ libvulkan-dev spirv-headers glslc pkg-config

          # Build & install Khronos SPIRV-Headers
          if [ ! -d /tmp/SPIRV-Headers ]; then
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/SPIRV-Headers
          fi
          cmake -S /tmp/SPIRV-Headers -B /tmp/SPIRV-Headers/build \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install /tmp/SPIRV-Headers/build

          # Populate /tmp/vkinc for NDK build
          mkdir -p /tmp/vkinc
          [ -d /usr/include/vulkan ] && cp -r /usr/include/vulkan /tmp/vkinc/ || true
          [ -d /usr/include/vk_video ] && cp -r /usr/include/vk_video /tmp/vkinc/ || true
          [ -d /usr/local/include/spirv ] && cp -r /usr/local/include/spirv /tmp/vkinc/ || true
          [ -d /usr/include/spirv ] && cp -r /usr/include/spirv /tmp/vkinc/ || true

          # Guarantee SPIRV-Headers cmake config is discovered
          if [ -d /usr/local/share/cmake/SPIRV-Headers ]; then
            echo "SPIRV_HEADERS_DIR=/usr/local/share/cmake/SPIRV-Headers" >> "$GITHUB_ENV"
          elif [ -d /usr/local/lib/cmake/SPIRV-Headers ]; then
            sudo mkdir -p /usr/local/share/cmake
            sudo ln -sfn /usr/local/lib/cmake/SPIRV-Headers /usr/local/share/cmake/SPIRV-Headers
            echo "SPIRV_HEADERS_DIR=/usr/local/share/cmake/SPIRV-Headers" >> "$GITHUB_ENV"
          fi

      - name: Validate Kotlin CPU compilation
        shell: bash
        run: |
          set -euo pipefail
          echo "Validating Kotlin compilation..."
          if ./gradlew tasks --all | grep -q "compileCpuDebugKotlin"; then
            ./gradlew :app:compileCpuDebugKotlin --no-daemon --stacktrace
          elif ./gradlew tasks --all | grep -q "compileDebugKotlin"; then
            ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
          else
            echo "Direct compileKotlin task not isolated; proceeding to variant build step."
          fi

      - name: Build APKs (CPU + Vulkan)
        shell: bash
        run: |
          set -euo pipefail
          echo "Building version ${APP_VERSION_NAME} (run #${BUILD_NUMBER})..."

          # Attempt release builds; fallback to debug if needed
          if ! ./gradlew assembleCpuRelease assembleVulkanRelease \
                --no-daemon --stacktrace; then
            echo "::warning::Release assembly failed; falling back to debug variants"
            ./gradlew assembleCpuDebug assembleVulkanDebug \
              --no-daemon --stacktrace
          fi

      - name: Stage APKs for distribution
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-apks
          VERSION_TAG="${APP_VERSION_NAME}"

          # Robust APK matching by flavor and type
          while IFS= read -r apk_path; do
            [ -z "$apk_path" ] && continue
            fname=$(basename "$apk_path")

            if [[ "$apk_path" =~ /cpu/ ]] || [[ "$fname" =~ [Cc][Pp][Uu] ]]; then
              flavor="cpu"
            elif [[ "$apk_path" =~ /vulkan/ ]] || [[ "$fname" =~ [Vv]ulkan ]]; then
              flavor="vulkan"
            else
              flavor="universal"
            fi

            if [[ "$apk_path" =~ /release/ ]] || [[ "$fname" =~ [Rr]elease ]]; then
              btype="release"
            else
              btype="debug"
            fi

            target="EdgeLLM-v${VERSION_TAG}-${flavor}-${btype}.apk"
            echo "Staging $apk_path -> release-apks/${target}"
            cp -f "$apk_path" "release-apks/${target}"
          done < <(find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null)

          count=$(ls -1 release-apks/*.apk 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No APK files found to stage!"
            find app/build -type f -name "*.apk" || true
            exit 1
          fi

          echo "Successfully staged $count APK(s):"
          ls -lh release-apks/
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edgellm-apks-v${{ env.APP_VERSION_NAME }}
          path: release-apks/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Compute Release Metadata
        id: release_meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="EdgeLLM Studio ${TAG}"
            IS_PRE="false"
          else
            TAG="v1.0.${{ github.run_number }}"
            TITLE="EdgeLLM Studio v1.0.${{ github.run_number }}"
            IS_PRE="false"
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: >-
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body: |
            ## EdgeLLM Studio v1.0.${{ github.run_number }}

            Automated build from `${{ github.sha }}`.

            ### Packages
            - **CPU (ARM NEON)** – universal ARM64
            - **Vulkan** – GPU-accelerated (Adreno / Mali)

            ### Version Information
            - Build Run: `${{ github.run_number }}`
            - Version Name: `1.0.${{ github.run_number }}`
            - Target OS: Android 14+ (API 34–36)
          files: release-apks/*.apk
          draft: false
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
