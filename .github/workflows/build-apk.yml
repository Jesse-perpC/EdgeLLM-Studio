name: Build EdgeLLM Android APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

# Needed to publish tag releases. Branch builds only upload artifacts.
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest
    env:
      CI: "false"
      ALLOW_DEBUG_SIGNED_RELEASE: "true"
      GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
      BUILD_NUMBER: ${{ github.run_number }}
      APP_VERSION_NAME: "1.0.${{ github.run_number }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Prepare env and debug keystore
        run: |
          set -e
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew

      # Tags publish versioned releases, so they must be signed with the real
      # upload key. Branch builds may use the debug-signed fallback.
      - name: Require release keystore on tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "Tag builds require secrets.RELEASE_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/my-upload-key.jks"
          {
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=${KEY_ALIAS:-upload}"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # The vulkan flavor compiles the ggml Vulkan backend, which needs the
      # Vulkan C++ headers and the SPIRV-Headers CMake config. Apt provides
      # the C headers; the rest is built from source only when missing.
      - name: Install Vulkan build deps
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev spirv-headers glslc cmake g++
          if [ ! -f /usr/include/vulkan/vulkan.hpp ] && [ ! -f /usr/local/include/vulkan/vulkan.hpp ]; then
            git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/Vulkan-Headers
            cmake -S /tmp/Vulkan-Headers -B /tmp/Vulkan-Headers/build -DCMAKE_INSTALL_PREFIX=/usr/local
            sudo cmake --install /tmp/Vulkan-Headers/build
          fi
          ls /usr/local/include/vulkan/vulkan.hpp 2>/dev/null || ls /usr/include/vulkan/vulkan.hpp
          SPIRV_CFG=$(find /usr/local /usr -name "SPIRV-HeadersConfig.cmake" 2>/dev/null | head -n 1 || true)
          if [ -z "$SPIRV_CFG" ]; then
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/SPIRV-Headers
            cmake -S /tmp/SPIRV-Headers -B /tmp/SPIRV-Headers/build -DCMAKE_INSTALL_PREFIX=/usr/local
            sudo cmake --install /tmp/SPIRV-Headers/build
            SPIRV_CFG=$(find /usr/local -name "SPIRV-HeadersConfig.cmake" 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$SPIRV_CFG" ]; then
            echo "SPIRV-HeadersConfig.cmake not found after install" >&2
            exit 1
          fi
          echo "SPIRV_HEADERS_DIR=$(dirname "$SPIRV_CFG")" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testCpuDebugUnitTest --no-daemon --stacktrace

      - name: Build all APKs
        run: ./gradlew assembleCpuDebug assembleCpuRelease assembleVulkanDebug assembleVulkanRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist-apks
          VERSION="1.0.${{ github.run_number }}"
          for FLAVOR in cpu vulkan; do
            for TYPE in debug release; do
              APK=$(find "app/build/outputs/apk/$FLAVOR/$TYPE" -maxdepth 1 -type f -name "*.apk" | head -n 1 || true)
              if [ -n "$APK" ]; then
                cp "$APK" "dist-apks/EdgeLLM-Studio-v$VERSION-$FLAVOR-$TYPE.apk"
              else
                echo "WARNING: missing $FLAVOR/$TYPE APK"
              fi
            done
          done
          ls -lh dist-apks

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EdgeLLM-Studio-APKs-1.0.${{ github.run_number }}
          path: dist-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package Windows bundle
        run: |
          set -e
          mkdir -p dist-windows
          FIRST_APK=$(ls dist-apks/*.apk | head -n 1)
          cp "$FIRST_APK" dist-windows/EdgeLLM-Studio.apk
          if [ -d scripts/windows ]; then
            cp scripts/windows/* dist-windows/ 2>/dev/null || true
          fi
          ( cd dist-windows && zip -r ../EdgeLLM-Studio-Windows-Desktop.zip . )
          ls -lh EdgeLLM-Studio-Windows-Desktop.zip

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: EdgeLLM-Studio-Windows-Desktop
          path: EdgeLLM-Studio-Windows-Desktop.zip
          if-no-files-found: warn
          retention-days: 30

      # Versioned releases come from tags only. Branch pushes upload
      # artifacts above without creating releases.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-apks/*.apk
            EdgeLLM-Studio-Windows-Desktop.zip
          name: EdgeLLM Studio ${{ github.ref_name }}
          body: |
            EdgeLLM Studio ${{ github.ref_name }} (commit ${{ github.sha }}).

            cpu APK: default install, GGUF on CPU (ARM NEON). vulkan APK: ggml
            Vulkan backend compiled in (separate package, needs a device Vulkan
            driver, falls back to CPU). Debug APKs are for diagnostics only.

            Not shipped: Hexagon HTP offload, MNN-LLM runtime, AICore/Gemini
            Nano (see INSTALL.md). Tag builds are signed with the release key.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
